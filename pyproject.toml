[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "semtrail"
version = "0.1.0"
description = "Self-hosted data agents grounded in dbt, with enforced model access and inspectable evidence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "sqlglot>=26,<31",
  "duckdb>=1.2,<2",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
dbt-demo = ["dbt-core>=1.9,<1.10", "dbt-duckdb>=1.9,<1.10"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
mcp = ["mcp>=1.10,<2"]

[project.scripts]
semtrail = "semtrail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semtrail"]

[tool.hatch.build]
artifacts = ["src/semtrail/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires SEMTRAIL_TEST_POSTGRES_DSN"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
